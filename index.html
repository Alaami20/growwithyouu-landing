const home=`<section class="hero shell"><span class="label">Founder-led technology company · Haifa</span><h1>We build what<br><em>should exist.</em></h1><p>Grow With You builds intelligent products and creates a place where ambitious people gain real experience, take ownership, and grow with the company.</p><div class="orbit"><i class="orb"></i></div></section><section class="statement"><div class="shell two"><span class="label">01 · Who we are</span><div><h2>Not an agency. A place where <span>people and products</span> grow together.</h2><p>We build our own ventures around real human problems. The work is serious, the standards are high, and talented people build experience by shipping products—not by waiting for permission.</p><div class="facts"><div><b>02</b><span>Focused ventures</span></div><div><b>20+</b><span>People building together</span></div><div><b>01</b><span>Shared belief</span></div></div></div></div></section><section class="section shell"><div class="sectionHead"><span class="label">02 · Our ventures</span><h2>Two products.<br>One way of building.</h2></div><article class="venture"><div><span class="label">Financial intelligence · AI</span><h3>Crypora</h3><p>An AI crypto guide bringing intelligence, learning, practice, and responsible tools into one clear experience.</p></div><div class="art">CRYPORA</div></article><article class="venture light"><div><span class="label">Travel intelligence · AI</span><h3>Tripfly</h3><p>A smarter travel companion bringing discovery, planning, and the journey into one effortless experience.</p></div><div class="art">TRIPFLY</div></article></section><section class="principles"><div class="shell"><span class="label">03 · How we build</span><div class="cards"><article><b>01</b><h3>Start with the problem.</h3><p>Technology matters only when it creates human utility.</p></article><article><b>02</b><h3>Build with ownership.</h3><p>Everyone close to the work shares responsibility for the outcome.</p></article><article><b>03</b><h3>Grow through the work.</h3><p>The work is where real experience begins.</p></article></div></div></section><section class="section shell"><div class="sectionHead"><span class="label">04 · Leadership</span><h2>Close to the work.<br>Aligned on the future.</h2></div><div class="teamGrid">${team()}</div></section>${support}<section class="cta shell"><span class="label">05 · What’s next</span><h2>The future is not<br>something we wait for.<br><em>We build it.</em></h2></section>`;
const hero=(k,t,c)=>`<section class="pageHero shell"><span class="label">${k}</span><h1>${t}</h1><p>${c}</p></section>`;
const company=hero("The company","Built around people.<br>Proven through products.","Grow With You is a founder-led technology company creating intelligent ventures while opening the door for ambitious people to gain real experience, ownership, and a path to grow.")+`<section class="story"><div class="shell two"><span class="label">Why we exist</span><div><h2>Potential is everywhere.<br>Opportunity is not.</h2><p>We know what it means to be told that experience is required before anyone gives you the chance to earn it. Grow With You was built to break that loop.</p><p>This is not a training simulation and it is not an agency model. We build our own ventures, solve difficult problems, and create value for real users.</p></div></div></section><section class="section shell"><span class="label">Our operating system</span><div class="values"><article><b>01</b><h3>Human utility</h3><p>We build what makes people more capable.</p></article><article><b>02</b><h3>Earned trust</h3><p>We communicate honestly and design responsibly.</p></article><article><b>03</b><h3>Ownership</h3><p>People closest to the work care for the outcome.</p></article></div></section>${support}`;
